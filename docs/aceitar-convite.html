<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odômetro Escolar — Aceitar convite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --azul: #1d4ed8; --verde: #16a34a; --vermelho: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #f3f4f6; color: #111827; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
  .card { max-width: 420px; width: 100%; background: #fff; border-radius: 14px; padding: 28px; border: 1px solid #e5e7eb; }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--azul); }
  .sub { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
  .resumo { background: #eff6ff; border-radius: 10px; padding: 14px 16px; font-size: 14px; margin-bottom: 20px; }
  .resumo b { color: #1e3a8a; }
  label { display: block; font-size: 13px; color: #374151; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
  input[disabled] { background: #f3f4f6; color: #6b7280; }
  button { width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 8px; background: var(--azul); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .erro { color: var(--vermelho); font-size: 13px; margin-top: 10px; }
  .ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 10px; padding: 16px; font-size: 14px; text-align: center; }
  .oculto { display: none !important; }
  .dica { font-size: 12px; color: #9ca3af; margin-top: 6px; }
</style>
</head>
<body>

<div class="card">
  <h1>Odômetro Escolar</h1>
  <p class="sub">Aceitar convite de acesso</p>

  <div id="carregando">Verificando convite…</div>

  <div id="invalido" class="oculto">
    <div class="erro" id="msg-invalido"></div>
  </div>

  <div id="form-area" class="oculto">
    <div class="resumo">
      Você foi convidado por <b id="txt-empresa"></b> para acessar como <b id="txt-papel"></b>.
    </div>

    <label>E-mail</label>
    <input id="email" disabled />

    <label for="senha">Crie uma senha</label>
    <input id="senha" type="password" autocomplete="new-password" placeholder="mínimo 8 caracteres" />

    <label for="senha2">Confirme a senha</label>
    <input id="senha2" type="password" autocomplete="new-password" />

    <button id="btn-confirmar">Criar acesso</button>
    <div class="erro" id="erro-form"></div>
  </div>

  <div id="sucesso" class="oculto">
    <div class="ok">
      Conta criada! Enviamos um e-mail de confirmação para <b id="txt-email-sucesso"></b>.
      Clique no link do e-mail para ativar seu acesso e depois faça login normalmente.
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lkelzwpeopwnqubnflkt.supabase.co";
const SUPABASE_KEY = "sb_publishable_8uR0ZCyIkYQwUgErYl5NHw_rYnicoBj";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PAPEL_LEGIVEL = { administrador: "Administrador", coordenador: "Coordenador", funcionario: "Funcionário" };
const el = (id) => document.getElementById(id);

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

let conviteEmail = "";

(async function init() {
  if (!token) return mostrarInvalido("Link de convite inválido: token ausente.");

  const { data, error } = await sb.rpc("validar_convite", { p_token: token });
  const convite = Array.isArray(data) ? data[0] : data;

  el("carregando").classList.add("oculto");

  if (error || !convite) return mostrarInvalido("Não foi possível validar este convite.");
  if (!convite.valido) return mostrarInvalido("Este convite já foi usado ou expirou. Peça para o administrador enviar um novo.");

  conviteEmail = convite.email;
  el("txt-empresa").textContent = convite.empresa_nome;
  el("txt-papel").textContent = PAPEL_LEGIVEL[convite.papel] ?? convite.papel;
  el("email").value = convite.email;
  el("form-area").classList.remove("oculto");
})();

function mostrarInvalido(msg) {
  el("carregando").classList.add("oculto");
  el("invalido").classList.remove("oculto");
  el("msg-invalido").textContent = msg;
}

el("btn-confirmar").addEventListener("click", async () => {
  el("erro-form").textContent = "";
  const senha = el("senha").value;
  const senha2 = el("senha2").value;

  if (senha.length < 8) { el("erro-form").textContent = "A senha precisa ter pelo menos 8 caracteres."; return; }
  if (senha !== senha2) { el("erro-form").textContent = "As senhas não coincidem."; return; }

  el("btn-confirmar").disabled = true;
  const { error } = await sb.auth.signUp({ email: conviteEmail, password: senha });
  el("btn-confirmar").disabled = false;

  if (error) {
    el("erro-form").textContent = "Falha ao criar acesso: " + error.message +
      (error.message?.toLowerCase().includes("already") ? " — se você já tem conta, use \"Esqueci minha senha\" na tela de login." : "");
    return;
  }

  el("form-area").classList.add("oculto");
  el("txt-email-sucesso").textContent = conviteEmail;
  el("sucesso").classList.remove("oculto");
});
</script>
</body>
</html>
